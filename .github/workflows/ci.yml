name: E-commerce API Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE ecommerce_test_db;"

      - name: Run API automation tests
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_test_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          pytest -v \
            --cov=app \
            --cov=main \
            --cov-report=term-missing
